name: IMSLP 선별 수확

on:
  workflow_dispatch:
    inputs:
      limit:
        description: '이번 런 신규 수집 상한(곡)'
        default: '5000'

permissions:
  contents: write

concurrency:
  group: imslp
  cancel-in-progress: false

jobs:
  imslp:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      # 태그 접두사 — 수집기가 450곡마다 imslp-1, imslp-2 … 로 나눈다
      IMSLP_TAG: imslp
      IMSLP_LIMIT: ${{ inputs.limit }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: 도구 설치 (poppler·webp)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils webp

      - name: 수집 실행
        run: python3 collect_imslp.py

      - name: 릴리스 자산 업로드 (샤드별)
        run: |
          # 릴리스 하나에 자산 1,000개 상한이 있다. 수집기가 곡을
          # 450개씩 _imslp_out/<태그>/ 로 나눠 담으므로 디렉터리마다
          # 자기 릴리스에 올린다. 상한에 걸려 조용히 잘리면 앱에서
          # 미리보기·다운로드가 안 된다(교본에서 겪은 실패).
          shopt -s nullglob
          dirs=(_imslp_out/*/)
          if [ ${#dirs[@]} -eq 0 ]; then
            echo '업로드할 자산 없음'
            exit 0
          fi
          fail=0
          for d in "${dirs[@]}"; do
            tag=$(basename "$d")
            n=$(ls "$d" | wc -l)
            echo "== $tag : 자산 $n개"
            gh release view "$tag" >/dev/null 2>&1 || \
              gh release create "$tag" -t "IMSLP scores ($tag)" \
                -n "Public domain scanned scores mirrored from IMSLP."
            ls "$d" | sort > _assets.txt
            split -l 50 _assets.txt _chunk_
            for c in _chunk_*; do
              files=$(sed "s|^|$d|" "$c" | tr '\n' ' ')
              ok=0
              for i in 1 2 3; do
                if timeout 900 gh release upload "$tag" $files --clobber; then
                  ok=1; break
                fi
                sleep $((i * 5))
              done
              [ $ok -eq 1 ] || { echo "  ! $tag 업로드 실패"; fail=1; }
            done
            rm -f _assets.txt _chunk_*
          done
          # 자산이 안 올라갔는데 카탈로그만 커밋하면 앱에서 깨진 곡이
          # 생긴다 — 실패하면 여기서 멈춘다.
          [ $fail -eq 0 ] || exit 1

      - name: 카탈로그 커밋
        run: |
          git config user.name sheet-collector-bot
          git config user.email actions@github.com
          git add catalog2.json
          if git diff --cached --quiet; then
            echo '변경 없음'
            exit 0
          fi
          git commit -m 'IMSLP 자동 수집 결과 [skip ci]'
          for i in 1 2 3 4; do
            git pull --rebase origin main && git push origin HEAD:main && break
            sleep $((i * 2))
          done
