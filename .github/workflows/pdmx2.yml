name: PDMX 확장 수집 (2권)

on:
  workflow_dispatch:
    inputs:
      new_add:
        description: '이번 런 신규 추가 상한(목표 곡수 미세조정)'
        default: '3000'

permissions:
  contents: write

concurrency:
  group: pdmx2
  cancel-in-progress: false

jobs:
  pdmx2:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: 도구 설치 (poppler·webp)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils webp

      - name: 수집 실행
        env:
          NEW_ADD: ${{ inputs.new_add }}
        run: python3 collect_pdmx2.py

      - name: 결과 커밋
        run: |
          git config user.name sheet-collector-bot
          git config user.email actions@github.com
          git add catalog2.json
          [ -d raw ] && git add raw
          [ -d mids ] && git add mids
          [ -d thumbs ] && git add thumbs
          if git diff --cached --quiet; then
            echo '변경 없음'
            exit 0
          fi
          git commit -m 'PDMX 확장 자동 수집 결과 [skip ci]'
          for i in 1 2 3 4; do
            git pull --rebase origin main && git push origin HEAD:main && break
            sleep $((i * 2))
          done
